# Gathering (docs/design/gathering.md): the kinds of resource node placed in the world. `wire` is
# stored in node rows and runs 0, 1, 2, … like hulls. `kind` is `plant`, `ore` or `tree`, and
# `item` is an id from items.toml. Names come from docs/world/. Ore's 10 labor is the original's
# iron vein (B); the other numbers are ours, for the M1 playtest to tune.

[gathering]
# How close a character must stand: horizontally, and up or down.
reach_m = 3.0

# Plants
[[node]]
wire = 0
id = "saltreed_clump"
name = "Saltreed Clump"
kind = "plant"
item = "saltreed"
yield_min = 2
yield_max = 4
labor = 5
gather_s = 2.0
regrow_s = 300

