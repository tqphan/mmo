# Farming (docs/design/farming.md): what grows from each seed. `wire` is stored in crop rows and runs
# 0, 1, 2, … like nodes. `kind` is `crop`, `tree` or `animal`; `seed` is an item of kind `seed`,
# `product` any item, and `climate` an id from land.toml. Times are outside the ideal climate.
# Hearthgrain's times follow the original's barley (30 min ideal, 43 elsewhere; C); the other
# numbers are ours, for the M1 playtest to tune.

[farming]
# How close a character must stand to plant, harvest or uproot, horizontally.
reach_m = 3.0
# Growth time in the ideal climate, in percent (barley: 30 of 43 minutes; C).
ideal_pct = 70

# Crops: one harvest, then gone; left ripe for a day, they wither.
[[crop]]
wire = 0
id = "hearthgrain"
name = "Hearthgrain"
kind = "crop"
seed = "hearthgrain_seed"
climate = "temperate"
grow_s = 2580
product = "hearthgrain"
yield_min = 3
yield_max = 5
labor = 3
regrow_s = 0
wither_s = 86400
space_m = 0.5
plot_only = false
seed_pct = 0

