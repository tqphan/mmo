# Items (docs/design/items.md). `wire` is the number stored in item rows: it never changes and is
# never reused, even after an item is removed, so gaps are fine. 0 is reserved. Kinds are
# `material`, `consumable` and `gear`; gear doesn't stack. Names come from docs/world/.

[bag]
# Slots in every character's bag: the original's starting size (B). Expansion comes in M2.
slots = 50

