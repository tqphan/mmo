# Combat (docs/design/combat.md): vitals, skills and where the dead respawn. Skill `wire`s are stored
# in casts and combat events, 100 to 999 (below 100 are the cannon and dev swing); skillset and
# shrine wires run 0, 1, 2, … like hulls. Names come from docs/world/. Every number is ours, for the
# M1 playtest to tune: the original's regeneration, global cooldown and respawn HP weren't found.

[combat]
# Every character's, until levels and gear.
hp_max = 1000
mp_max = 800
# Points per second, out of combat and in it.
hp_regen_out = 20
hp_regen_in = 4
mp_regen_out = 16
mp_regen_in = 6
# A character is in combat this long after it last hit or was hit.
combat_s = 6
# Every skill starts the global cooldown.
gcd_ms = 1000
# Moving this far from where a cast began interrupts it.
cast_move_m = 0.5
# How far beyond its range a target may have gone when a cast finishes.
cast_leeway_m = 3.0
# The wait before respawning: the first, plus a step for each further death within
# `death_stack_s`, up to the most (180 s and a 10-minute debuff, B).
respawn_first_s = 5
respawn_step_s = 25
respawn_max_s = 180
death_stack_s = 600
# HP and mana on respawning, in percent.
respawn_pct = 50
# A dev Straw Dummy's HP.
dummy_hp = 5000

