# Combat (docs/design/combat.md): vitals, skills and where the dead respawn. Skill `wire`s are stored
# in casts and combat events, 100 to 999 (below 100 are the cannon and dev swing); skillset and
# shrine wires run 0, 1, 2, … like hulls. Names come from docs/world/. Every number is ours, for the
# M1 playtest to tune: the original's regeneration, global cooldown and respawn HP weren't found,
# nor its experience table or how its crowd control diminished.

[combat]
# A level-1 character's; each level adds `progress.hp_per_level` and `mp_per_level`.
hp_max = 1000
mp_max = 800
# Points per second, out of combat and in it.
hp_regen_out = 20
hp_regen_in = 4
mp_regen_out = 16
mp_regen_in = 6
# A character is in combat this long after it last hit or was hit.
combat_s = 6
# Every skill starts the global cooldown.
gcd_ms = 1000
# Moving this far from where a cast began interrupts it.
cast_move_m = 0.5
# How far beyond its range a target may have gone when a cast finishes.
cast_leeway_m = 3.0
# The wait before respawning: the first, plus a step for each further death within
# `death_stack_s`, up to the most (180 s and a 10-minute debuff, B).
respawn_first_s = 5
respawn_step_s = 25
respawn_max_s = 180
death_stack_s = 600
# HP and mana on respawning, in percent.
respawn_pct = 50
# A dev Straw Dummy's HP.
dummy_hp = 5000

# Levels, experience and skillset picks (combat B).
[progress]
# Experience to go from each level to the next, levels 1 to 14; its length plus 1 is the cap.
xp_to_next = [100, 150, 220, 300, 400, 520, 660, 820, 1000, 1200, 1450, 1750, 2100, 2500]
# The levels at which a character may pick a skillset, one each.
skillset_at = [1, 5, 10]
# What each level adds to the HP and mana maximums.
hp_per_level = 100
mp_per_level = 40
# Experience for killing a level-1 foe that isn't a character, plus this per level above 1; less by
# `kill_xp_gap_pct` percent per level the killer is above it, down to nothing.
kill_xp = 40
kill_xp_per_level = 20
kill_xp_gap_pct = 25
# A death to anything but another character loses this share of the experience the level needs,
# never below the level's start.
death_xp_pct = 5

# Crowd control's diminishing returns (combat B). Each control lands for a share of its duration by
# how many of its group landed since the group's window last ran out: stuns and knockdowns are one
# group, snares another. The window runs `window_s` past the end of the last one that landed.
# Past the last step the target is immune until it runs out.
[control]
window_s = 15
steps_pct = [100, 50, 25]

# Crime (docs/design/crime.md): evidence, reports and the mark that makes an attacker fair game.
# The points are the original's older numbers (B); the 24 h evidence is the longer of two
# remembered figures (C). Being Sought does nothing more until trials (M2).
[crime]
# The status an attacker gets, and how long it lasts (30 s, B).
mark = "bloodmarked"
mark_s = 30
# How long evidence lies before it fades.
evidence_s = 86400
# How close a reporter must stand, horizontally and vertically.
reach_m = 4.0
# What each kind of evidence adds to the offender's crime points and Notoriety when reported.
footprint_points = 3
bloodstain_points = 1
blood_pool_points = 10
# Crime points at or above this make a character Sought.
sought_points = 50

# Statuses, the buffs and debuffs skills put on fighters, kept in their `vitals` row. `control` is
# none, stun or knockdown (no moving or skills) or snare (`speed_pct` of the speed limit). `dealt_pct`
# and `taken_pct` change direct damage dealt and taken. A status with `tick_ms` hurts (a debuff) or
# heals (a buff) by its effect's amount that often.
[[status]]
wire = 0
id = "slowed"
name = "Slowed"
debuff = true
control = "snare"
speed_pct = 60

[[status]]
wire = 1
id = "stunned"
name = "Stunned"
debuff = true
control = "stun"

[[status]]
wire = 2
id = "felled"
name = "Felled"
debuff = true
control = "knockdown"

[[status]]
wire = 3
id = "soaked"
name = "Soaked"
debuff = true
dealt_pct = -10

[[status]]
wire = 4
id = "scorched"
name = "Scorched"
debuff = true
tick_ms = 1000

[[status]]
wire = 5
id = "sundered"
name = "Sundered"
debuff = true
taken_pct = 15

[[status]]
wire = 6
id = "shaken"
name = "Shaken"
debuff = true
dealt_pct = -20

[[status]]
wire = 7
id = "fervor"
name = "Fervor"
debuff = false
dealt_pct = 20

[[status]]
wire = 8
id = "bulwark"
name = "Bulwark"
debuff = false
taken_pct = -30

[[status]]
wire = 9
id = "renewal"
name = "Renewal"
debuff = false
tick_ms = 1000

# Put on a character that harms another who isn't marked: anyone may harm it with no crime
# (docs/design/crime.md). It does nothing else.
[[status]]
wire = 10
id = "bloodmarked"
name = "Bloodmarked"
debuff = true

[[skillset]]
wire = 0
id = "emberlore"
name = "Emberlore"

[[skillset]]
