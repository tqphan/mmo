# Crafting (docs/design/crafting.md): station kinds and recipes. Station `wire`s are stored in
# station rows and recipe `wire`s in craft jobs; both run 0, 1, 2, … like hulls. Items are ids from
# items.toml, and names come from docs/world/. Labor and times are per unit and ours, for the M1
# playtest to tune.

[crafting]
# How close a character must stand to a station: horizontally, and up or down.
reach_m = 4.0
# The most units one craft may ask for.
max_count = 100

[[station]]
wire = 0
id = "joiners_bench"
name = "Joiner's Bench"

[[station]]
wire = 1
id = "bloomery"
name = "Bloomery"

[[station]]
wire = 2
id = "cookhearth"
name = "Cookhearth"

# Makes trade packs (docs/design/trade.md), one at a time, onto the crafter's back.
[[station]]
wire = 3
id = "packwright_bench"
name = "Packwright's Bench"

