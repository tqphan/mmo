# NPCs (docs/design/npcs.md). Kind `wire`s are stored in `entity.ref_id`: never changed or reused.
# Skills are Wildcraft skills from combat.toml, tried in order; loot lines each drop `min` to `max`
# of `item` with chance `pct`%. Names come from docs/world/. Every number is ours, for the M1
# playtest to tune: the original's monster stats, ranges and timers weren't found.

[npc]
# How often the brain thinks: every second 100 ms tick.
brain_ms = 200
# A spawn point with a living character this close has its NPC; an idle NPC with none within
# `sleep_m` goes away. The Near tier shows at least 120 m.
wake_m = 120.0
sleep_m = 160.0
# When it or its target is this far from home, an NPC gives up the fight and goes back.
leash_m = 40.0
# A moving NPC's position is published this often, like a client's heartbeat.
heartbeat_ms = 500
# The pause between strolls, and strolling and returning speeds as shares of the kind's.
wander_min_s = 8
wander_max_s = 20
walk_pct = 45
return_pct = 150
# A corpse lies this long; its loot is anyone's this long after the death.
corpse_s = 90
free_s = 30
# The first hitter owns the loot with at least this share of the damage.
tag_pct = 50
# Threat from healing someone an NPC fights (share of the HP healed), and from a debuff alone.
heal_threat_pct = 50
status_threat = 20
# How close a looter must stand.
loot_m = 4.0

