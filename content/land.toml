# Land use and climate (docs/design/world.md): what each 4 m texel of the world's land-use raster
# means. `wire` is the value stored in the raster: the use class in the low 4 bits, the climate in
# bits 4–6, so there can be at most 16 uses and 8 climates. The values must run 0, 1, 2, … with no
# gaps. Which uses allow building is from RESEARCH §2.4 (A); planting is allowed on open land too
# (B), and the ideal climate's growth rule is in farming.toml (docs/design/farming.md). Plots, their tax and demolition follow (docs/design/land.md).

[[land_use]]
id = "wild"
wire = 0
buildable = false
plantable = true

[[land_use]]
id = "housing"
wire = 1
buildable = true
plantable = true

[[land_use]]
id = "town"
wire = 2
buildable = false
plantable = false

[[land_use]]
id = "road"
wire = 3
buildable = false
plantable = false

[[climate]]
id = "temperate"
wire = 0

[[climate]]
id = "tropical"
wire = 1

[[climate]]
id = "arid"
wire = 2

[[climate]]
id = "subarctic"
wire = 3

# Property rules (docs/design/land.md). A week's grace and a fixed hour of demolition are from the
# original (B); the hour, the prepay limit, the multipliers and the reach are ours.
[property]
tax_item = "levy_seal"
week_s = 604800
grace_s = 604800
demolish_hour_utc = 20
prepay_weeks = 4
# Every plot's weekly tax is multiplied by the entry for how many plots the account owns; the
# length is the most it may own. "Steeply after two" (B).
heavy_tax_pct = [100, 100, 200, 300, 400]
reach_m = 8.0

# Plot kinds. `wire` is stored in plot rows; sizes are multiples of the 4 m land texel. The taxes
# are the original's 8×8 and 16×16 rates in certificates (B).
[[plot]]
wire = 0
id = "garden"
name = "Garden"
deed = "garden_deed"
size_m = 8
max_rise_m = 2.0
tax = 5

[[plot]]
wire = 1
id = "farm"
name = "Farm"
deed = "farm_deed"
size_m = 16
max_rise_m = 3.0
tax = 10
